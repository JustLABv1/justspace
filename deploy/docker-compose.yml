name: justspace

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE in .env}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  init-uploads:
    image: ${PERMISSIONS_IMAGE:-alpine:3.24}
    user: "0:0"
    command: ["sh", "-ec", "mkdir -p /data/uploads && chown -R 10001:10001 /data/uploads"]
    volumes:
      - uploads:/data/uploads
    restart: "no"
    security_opt:
      - no-new-privileges:true

  backend:
    image: ${BACKEND_IMAGE:?Set BACKEND_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      init-uploads:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      PORT: 8080
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:?Set DB_USER in .env}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      OIDC_ENCRYPTION_KEY: ${OIDC_ENCRYPTION_KEY:?Set OIDC_ENCRYPTION_KEY in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      MIGRATIONS_MODE: auto
      FILE_STORAGE_ROOT: /data/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - uploads:/data/uploads
    security_opt:
      - no-new-privileges:true

  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in .env}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:
