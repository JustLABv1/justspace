name: PR Check

on:
  pull_request:
    branches:
      - main
    paths:
      - '.dockerignore'
      - 'Dockerfile'
      - 'services/**'
      - 'deploy/**'
      - '.github/workflows/**'

jobs:
  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('services/frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: services/backend/go.mod
          cache-dependency-path: services/backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Vet
        run: go vet ./...

      - name: Build
        run: CGO_ENABLED=0 go build -ldflags="-s -w" -o justspace-backend .

  validate-helm-chart:
    name: Validate Helm Chart
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Build and lint chart
        run: |
          helm dependency build deploy/helm/justspace
          helm lint deploy/helm/justspace \
            --values deploy/helm/justspace/values-production.example.yaml
          git diff --exit-code -- deploy/helm/justspace/Chart.lock deploy/helm/justspace/charts

      - name: Render deployment variants
        run: |
          helm template justspace deploy/helm/justspace \
            --namespace justspace \
            --values deploy/helm/justspace/values-production.example.yaml >/dev/null
          helm template justspace deploy/helm/justspace \
            --namespace justspace \
            --values deploy/helm/justspace/values-production.example.yaml \
            --set customCA.enabled=true \
            --set customCA.existingConfigMap=organisation-ca >/dev/null
          helm template justspace deploy/helm/justspace \
            --namespace justspace \
            --values deploy/helm/justspace/values-production.example.yaml \
            --set postgresql.enabled=true \
            --set postgresql.auth.existingSecret=postgres-auth \
            --set postgresql.tls.certificatesSecret=postgres-tls \
            --set customCA.enabled=true \
            --set customCA.existingConfigMap=organisation-ca >/dev/null
